# `uv run glasses-gen` (src/ftv_pipeline/glasses_gen.py): our own glasses (MIT), built from these numbers.
# Sizes in millimetres, as an optician writes them: lens width × lens height, bridge (the gap between the lenses).
#
# shape   round | oval | rect | square | panto | wayfarer | cateye | aviator | hexagon | octagon | browline | dframe
# kind    acetate (thick plastic front) | metal (wire rims, nose pads) | browline (plastic brow + wire rims) |
#         halfrim (a bar over the top, a nylon cord under the lens) | rimless (lenses held by the bridge and hinges)
# frame   colour, pattern (solid | tortoise | havana), roughness;  metal = colour + roughness of wire parts
# lens    tint, opacity (clear ~0.04, sunglasses 0.8+), gradient (0 = even, 1 = clear at the bottom), mirror (0..1;
#         a mirror lens reflects in its tint, so give it the coating's colour: silver, blue, gold)
# rim     acetate: band width round the lens, extra on top (brow), depth (front thickness); metal: wire radius
# fit     drop = the lens centre this far below the pupil

[defaults]
bridge = 20
rim = 4.5
rim_top = 0.0
depth = 4.6
wire = 0.75
drop = 2.0
wrap = 5.0          # face form: the front curves back this much at its outer ends
tilt = 7.0          # pantoscopic tilt, degrees (lower rim nearer the cheeks)
base = 110.0        # lens front curve radius (mm)
temple_height = 5.0
temple_thick = 3.2
nasal = 0.2        # plastic fronts: the lower nose-side corner cut back by this share of the lens height

# Picker order = this order: clear glasses from the lightest frames (rimless, wire) to the boldest plastic ones,
# then sunglasses.

[style.rimless]
label = "Rimless"
shape = "rect"
kind = "rimless"
size = [52, 32]
bridge = 18
metal = { colour = "#b9bcc0", roughness = 0.22 }
lens = { tint = "#e8eef2", opacity = 0.06 }

