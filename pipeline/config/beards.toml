# `uv run beard-strands` (src/ftv_pipeline/beard_strands.py): full beards and moustaches as strands. Millimetres.

[picker]                   # the facial hair picker's order (stubble.py and beard_strands.py both write the index)
order = [
  "shadow", "stubble", "heavy-stubble",                                                   # stubble
  "short-beard", "full-short-beard",                                                      # short beards
  "full-beard", "scruffy-beard", "garibaldi", "long-beard", "wizard-beard",               # full beards
  "chin-strap", "chin-curtain", "mutton-chops", "neckbeard",                              # along the jaw
  "soul-patch", "short-goatee", "goatee", "van-dyke",                                     # the chin
  "moustache-stubble", "pencil-moustache", "short-moustache", "moustache", "horseshoe-moustache",
  "walrus-moustache", "handlebar-moustache", "fu-manchu",                                 # moustaches
]

[mask]                     # the outline (stubble.mask); styles override
edge_mm = [3.0, 11.0]
smooth = 6
patch_mm = 22
patchiness = 0.2
cheek_thin = 0.3
nose_gap_mm = -1.0
wing_gap_mm = 5.0
nose_reach_mm = [6, 8]
min_cover = 0.3           # no hairs where the outline is fainter than this (its faded edge is the stubble under it)
lone_mm = 2.5             # … nor any with fewer than 3 others within this distance
zone_solid = 0.45          # an archetype's hairs grow only where its regions (zones) reach this
islands = { link_mm = 3.0, share = 0.05 }   # no little patches cut off from the rest: roots this close are joined, patches under this share of the biggest dropped

[grow]
points = 14
converge = 0.15            # below the mouth, hairs comb a little in towards the chin
moustache_spread = 0.6     # moustache hairs comb out from the middle of the lip
moustache_standoff_mm = 2.5  # the moustache's outside layer (it lies flatter than the beard) …
moustache_ramp_mm = 6        # … reached this far along its hairs
moustache_density = 2.5      # hairs per area on the upper lip, relative to the beard
moustache_bend = 0.3         # its hairs' arc, relative to bend_deg
moustache_gravity = 0.15     # past the lip its hairs hang a little …
moustache_tuck = 0.0         # … not turning under like the beard's ends (tucked, the tips hook back into the mouth)
moustache_forward = 0.1      # … and never heading back into the mouth: they drape over the lip
moustache_leave_ny = 0.3     # they let go where the lip turns in towards the mouth (skin facing down past this)
moustache_walk_down = 0.5    # they lie on the skin only where that heads clearly down (under the nose it would take
moustache_min_fall = 0.7     # … them sideways: a hook at the root); elsewhere they grow down and out, at least this steeply
moustache_walk_back = 0.2    # … nor where the skin would take them back into the mouth faster than this (the lip's bulge)
moustache_edge = [0.3, 0.65] # hairs from where the outline reaches 0.3, full by 0.65: a crisp top edge, not the beard's fade
flow_noise_deg = 8         # the comb direction wanders this much over the beard (smoothly: neighbours agree)
jitter_deg = 4             # … and each hair this much on its own
bend_deg = 25              # each hair sweeps through about this arc along its length (shared with its neighbours)
fair = 4                   # smoothing passes along each strand (no kinks)
standoff_mm = [0.3, 7.0]   # height above the skin: against it at the root … the beard's outside layer at the tip
standoff_ramp_mm = 14      # how far along a hair it reaches its layer's height
layer_bias = 0.8           # < 1: more hairs in the outer layers
leave_ny = 0.45            # hairs let go of the skin where it faces down more than this (under the jaw and chin)
gravity = 0.4              # how much a hair that let go falls towards its tip
tuck = 0.35                # … and how much its end turns under, back towards the throat (a rounded beard)
min_fall = 0.2             # every hair points at least this much downwards (no hair grows up)
cohere_k = 12              # neighbours a hair's shape is compared with
cohere = 0.2               # every hair takes this much of its neighbours' mean shape …
stray = 0.25               # … and all of it once it strays further than this (per unit length) from them
per_clump = 24             # hairs per clump
clump = 0.4                # how strongly the tips gather
curl_mm = 0.5              # waves, shared by a clump
curl_period_mm = 12.0
frizz_mm = 0.25            # each hair's own small wobble
length_jitter = 0.12
young_share = 0.3          # hairs still growing in: 35–85 % of the length (soft, thinning ends)
lone_tip_mm = 2.5          # a hair whose tip has fewer than lone_tip_hairs other hairs within this is a stray: dropped
lone_tip_hairs = 6

[render]
children = [0, 1, 2]       # extra strands per hair on the low / medium / high tier
child_radius_mm = 0.8
width_mm = 0.09
tip_width = 0.35
natural = ["#1e140e", "#4a3524"]
shine = 0.6
under = { length = 0.75, shadow = 0.6 }   # stubble on the skin under the beard (skin shader), on its outline

# --- archetypes: the full beard's outline cut down to named regions of the face (beard_strands.zone_masks):
# zones = the regions it covers, cut = regions taken out; zone = their sizes (mm); zone_lengths = a region's hair
# length (mm); taper = the hairs gather towards x = ±x_mm at their tips (a point, or a tail per side)

[style.full-beard]
label = "Full beard"
guides = ["full-beard", "moustache"]
mask = { cheek_line_mm = [12, 40], neckline_mm = [28, 34], edge_soft_mm = 4 }
count = 9000
length_mm = 22
cheek_length = 0.55
moustache_mm = 7

[style.garibaldi]
label = "Garibaldi"
guides = ["full-beard", "moustache"]
hang_guides = ["viking-beard"]
hang_scale = 0.55
mask = { cheek_line_mm = [12, 40], neckline_mm = [30, 36], edge_soft_mm = 4 }
count = 15000
length_mm = 36
cheek_length = 0.5
moustache_mm = 9
grow = { gravity = 0.4, tuck = 0.7, standoff_mm = [0.3, 16.0], standoff_ramp_mm = 20, curl_mm = 1.0, curl_period_mm = 14.0 }

[style.long-beard]
label = "Long beard"
guides = ["full-beard", "moustache"]
hang_guides = ["viking-beard"]
mask = { cheek_line_mm = [12, 40], neckline_mm = [30, 36], edge_soft_mm = 4 }
count = 11000
length_mm = 28
cheek_length = 0.5
moustache_mm = 9
grow = { gravity = 0.6, tuck = 0.15, standoff_mm = [0.3, 9.0], curl_mm = 0.8, curl_period_mm = 14.0 }

[style.wizard-beard]
label = "Wizard beard"
guides = ["full-beard", "moustache"]
hang_guides = ["viking-beard"]
# long mainly from the middle of the chin (point), the cheeks and sides shorter, flowing in; wavy locks with a few
# flyaways, volume, and a smooth, full moustache drooping past the mouth corners into the beard (little of the beard's
# waves and locks: moustache_wave / moustache_clump)
hang_scale = 0.9
max_hang_mm = 90
mask = { cheek_line_mm = [12, 40], neckline_mm = [30, 36], edge_soft_mm = 4 }
count = 14000
length_mm = 40
cheek_length = 0.45
moustache_mm = 9
point = { mm = 170, width_mm = 46 }
taper = { x_mm = 0, amount = 0.5, power = 1.4 }
grow = { points = 26, gravity = 0.65, tuck = 0.05, standoff_mm = [0.3, 12.0], standoff_ramp_mm = 25, curl_mm = 2.6, curl_period_mm = 38.0, clump = 0.6, per_clump = 30, frizz_mm = 0.6, moustache_gravity = 0.25, moustache_spread = 1.1, moustache_wave = 0.15, moustache_clump = 0.25 }

[style.scruffy-beard]
label = "Scruffy beard"
guides = ["full-beard", "moustache"]
hang_guides = ["scruffy-beard"]
mask = { cheek_line_mm = [14, 44], neckline_mm = [22, 30], edge_soft_mm = 7, patchiness = 0.5 }
count = 8000
length_mm = 20
cheek_length = 0.6
moustache_mm = 8
grow = { points = 20, curl_mm = 1.3, curl_period_mm = 10.0, frizz_mm = 0.3, flow_noise_deg = 20, bend_deg = 35, clump = 0.45 }

[style.chin-curtain]
label = "Chin curtain"
guides = ["full-beard", "moustache"]
zones = ["jaw", "chin", "sideburns", "neck"]
cut = ["moustache"]
zone = { jaw_mm = 24, chin_half_mm = 30, chin_round_mm = 10, sideburn_mm = 20 }
count = 8000
length_mm = 22
cheek_length = 0.7

[style.chin-strap]
label = "Chin strap"
guides = ["full-beard", "moustache"]
# a clean, even band of short dense hair along the jaw and across the front of the chin, straight up into the
# sideburns: crisp edges (no patchiness, a hard band edge), lying flat (they never let go
# of the skin under the jaw, where they would hang as a fringe)
zones = ["jaw", "sideburns"]
cut = ["moustache"]
zone = { jaw_mm = 15, jaw_soft_mm = 1.5, jaw_chin = 0.55, sideburn_mm = 11 }
mask = { patchiness = 0.0 }
count = 6500
length_mm = 4.0
cheek_length = 1.0
hang_scale = 0.0
grow = { leave_ny = 0.98, standoff_mm = [0.2, 1.2], standoff_ramp_mm = 3, frizz_mm = 0.0, curl_mm = 0.0, flow_noise_deg = 4, jitter_deg = 2, bend_deg = 8, young_share = 0.1, length_jitter = 0.06, clump = 0.15 }

[style.mutton-chops]
label = "Mutton chops"
guides = ["full-beard", "moustache"]
zones = ["cheeks"]
cut = ["chin"]
zone = { cheek_x_mm = 40, chin_half_mm = 34 }
count = 6000
length_mm = 16
cheek_length = 1.0
hang_scale = 0.0

[style.neckbeard]
label = "Neckbeard"
guides = ["full-beard", "moustache"]
zones = ["neck"]
count = 5000
length_mm = 18
cheek_length = 1.0
hang_scale = 0.0
grow = { curl_mm = 1.2, curl_period_mm = 8.0, frizz_mm = 0.35, flow_noise_deg = 20 }

[style.goatee]
label = "Goatee"
guides = ["full-beard", "moustache"]
keep_within_x_mm = 26
mask = { neckline_mm = [24, 30], edge_soft_mm = 4, cheek_line_mm = [6, 8] }
count = 4500
length_mm = 26
cheek_length = 0.7
moustache_mm = 7

[style.van-dyke]
label = "Van Dyke"
guides = ["full-beard", "moustache"]
zones = ["chin", "moustache"]
zone = { chin_half_mm = 15, chin_gap_mm = 5, moustache_out_mm = 3 }
count = 4000
length_mm = 34
cheek_length = 1.0
moustache_mm = 9
taper = { x_mm = 0, amount = 0.8, power = 1.3 }

[style.soul-patch]
label = "Soul patch"
guides = ["full-beard", "moustache"]
zones = ["soul_patch"]
zone = { patch_half_mm = 8, patch_tall_mm = 8, patch_drop_mm = 9 }
count = 1150
length_mm = 11
cheek_length = 1.0
hang_scale = 0.0
taper = { x_mm = 0, amount = 0.55, power = 1.2 }

[style.moustache]
label = "Moustache"
guides = ["moustache"]
mask = { edge_mm = [2.0, 7.0] }
count = 2200
length_mm = 11
moustache_mm = 9.5
grow = { gravity = 0.2, moustache_spread = 0.9 }

[style.walrus-moustache]
label = "Walrus moustache"
guides = ["moustache"]
mask = { edge_mm = [2.0, 9.0] }
zones = ["moustache"]
zone = { moustache_out_mm = 9 }
count = 4200
length_mm = 18
moustache_mm = 17
grow = { moustache_standoff_mm = 4.5, moustache_spread = 0.4, frizz_mm = 0.35 }

[style.horseshoe-moustache]
label = "Horseshoe moustache"
guides = ["full-beard", "moustache"]
zones = ["moustache", "corners"]
zone = { bar_mm = 7, bar_shift_mm = 3 }
count = 4200
length_mm = 11
cheek_length = 1.0
moustache_mm = 9
hang_scale = 0.0

[style.handlebar-moustache]
label = "Handlebar moustache"
guides = ["moustache"]
mask = { edge_mm = [2.0, 7.0] }
zones = ["moustache"]
zone = { moustache_out_mm = -3 }   # its roots stop short of the mouth corners (the wing carries on past them)
count = 2600
length_mm = 26
moustache_mm = 26
# each side combed out along the lip into a waxed wing that curls up past the mouth corner (beard_strands.spine_groom)
grow = { points = 22, young_share = 0.0, length_jitter = 0.05, moustache_spread = 7.0, moustache_walk_down = 2.0, moustache_min_fall = 0.0, min_fall = 0.0, moustache_gravity = 0.0, moustache_bend = 0.0, frizz_mm = 0.0, clump = 0.6, per_clump = 40 }
spine = { kind = "curl", height_mm = 4.5, out_mm = 19, standoff_mm = 2.0, radius_mm = 5.0, tighten = 0.45, turn_deg = 250, gather = 0.92, reach = [0.6, 1.0] }

[style.fu-manchu]
label = "Fu Manchu"
guides = ["full-beard", "moustache"]
# a thin moustache whose hairs comb out along the lip and down past the mouth corners into two long tails, thick
# where they leave the lip, tapering to points (beard_strands.spine_groom, kind "drop")
zones = ["lip_line"]
zone = { lip_line_mm = 4.5 }
count = 2800
length_mm = 8
moustache_mm = 8
hang_scale = 0.0
grow = { points = 24, young_share = 0.0, length_jitter = 0.05, frizz_mm = 0.0, moustache_bend = 0.0, clump = 0.5, per_clump = 30 }
spine = { kind = "drop", height_mm = 3.0, out_mm = 3, standoff_mm = 1.5, bend_mm = 4, drop_mm = 75, lean = [0.12, 0.05], sway_mm = 3, gather = 0.92, gather_by = "end", reach = [0.3, 1.0] }

[style.pencil-moustache]
label = "Pencil moustache"
guides = ["moustache"]
mask = { edge_mm = [2.0, 7.0], patchiness = 0.0 }   # even: on a line this thin, patches read as gaps
# a thin, neat line right along the top of the upper lip, parted at the groove in the middle; short hairs lying flat,
# combed outwards along the line (they lie on the skin wherever it takes them down at all)
zones = ["lip_line"]
cut = ["philtrum"]
zone = { lip_line_mm = 5.0, philtrum_mm = 2.0 }
lip_band_mm = 2.2   # … then only the hairs within this of the lip's edge (exactly: the band is thinner than the mesh)
count = 9000
length_mm = 2.5
moustache_mm = 2.5
grow = { points = 6, moustache_edge = [0.05, 0.3], moustache_spread = 2.5, moustache_walk_down = -1.0, moustache_walk_back = 1.0, moustache_standoff_mm = 0.5, moustache_ramp_mm = 2, frizz_mm = 0.0, moustache_bend = 0.0, jitter_deg = 2, flow_noise_deg = 4, young_share = 0.15, length_jitter = 0.08, clump = 0.0, cohere = 0.5 }
