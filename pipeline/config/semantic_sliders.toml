alare_r = 9440                      # mirror of alare_l
cheilion_l = 4608                   # mouth-opening rim, outermost (mouth corner)
cheilion_r = 10736                  # mirror of cheilion_l
stomion_upper = 12275               # mouth-opening rim, midline, on the upper lip (its inner edge)
stomion_lower = 12281               # mouth-opening rim, midline, on the lower lip (its inner edge)
gonion_l = 2294                     # side of the jaw in front of the ear, normal closest to 45° out-and-down (jaw angle)
gonion_r = 8422                     # mirror of gonion_l
vertex = 12398                      # midline, highest (top of the head)
opisthocranion = 12460              # midline, y 0.26–0.36, furthest back (back of the skull)
euryon_l = 1637                     # above the ears, widest point of the skull
euryon_r = 7765                     # mirror of euryon_l
zygion_l = 3874                     # left_zygomatic_region, widest (cheekbone)
