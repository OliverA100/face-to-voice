# Face to Voice — published adult head and face measurements (mm), the yardstick for slider ends
# (src/ftv_pipeline/validate/anthro.py measures the same things on the model; `uv run slider-ranges` compares them).
#
# Rules: adults only; men and women POOLED (mean = midpoint of the two sexes, sd = pooled spread incl. the gap between
# the sexes); NO ethnicity or race anywhere: sources that pool everyone are preferred, and nothing here is split by group.
# low / high = rare-but-real extremes:
#   "min/max"   the smallest and largest value measured in a large survey (both sexes together)
#   "derived"   only mean and SD are published: mean ± 4.5 SD (the min/max of the large surveys below sit 3–5 SD out)
#
# Sources:
#   A  Gordon CC et al. 2014, 2012 Anthropometric Survey of U.S. Army Personnel (ANSUR II), NATICK/TR-15/007,
#      N = 4082 M / 1986 F. http://tools.openlab.psu.edu/publicData/ANSURII-TR15-007.pdf
#   N  Zhuang Z, Bradtmiller B 2005, Head-and-Face Anthropometric Survey of U.S. Respirator Users, JOEH 2:567–576,
#      Table VI, N = 2543 M / 1454 F. https://stacks.cdc.gov/view/cdc/190020/cdc_190020_DS1.pdf
#   F  Kesterke MJ et al. 2016, 3D Facial Norms database, Biol Sex Differ 7:23, Table S6, N ≈ 220 M / 360 F (3D scans).
#   K  Karaca Saygili O et al. 2016, Folia Morphol 75(4):512–517, Table 2, N = 100 M / 100 F (calipers).
#   R  Rhee SC et al. 2012, Aesthetic Plast Surg, literature summary of eyelid dimensions (mostly small samples).
#   Wide- / close-set eyes: Hall BD et al. 2009, Elements of Morphology (periorbital), Am J Med Genet A 149A:27–48:
#   interpupillary or inner-canthal distance beyond 2 SD of the mean (≈ 55–71 mm IPD, 26–39 mm en-en).

