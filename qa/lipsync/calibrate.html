<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lip-sync calibration</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #888; font: 14px system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #ui { position: fixed; left: 12px; bottom: 12px; z-index: 2; }
  button { font: inherit; padding: 10px 16px; }
</style>
</head>
<body>
<!--
  Flash + beep on ONE AudioContext timestamp, 1 per second, 60 ms long, every 4th one longer (sync marker).
  ?mode=heard (default): the flash is drawn when the beep should be HEARD (ctx.currentTime − outputLatency), the same
                         rule the app's mouth uses. Filmed from outside, flash vs sound = what the app gets wrong.
  ?mode=raw:             the flash is drawn at the beep's context time (no latency correction): checks the recorder.
  Uses WebGL like the app, so frame grabs behave the same.
-->
<canvas id="c"></canvas>
<div id="ui"><button id="go">Start</button> <span id="info"></span></div>
<!-- touch (the iPhone simulator, qa/lipsync simstale): one tap each -->
<div id="touch" style="position:fixed;left:0;right:0;top:40px;z-index:3;display:flex;gap:8px;justify-content:center">
  <button data-o='{"route":"direct"}'>Direct</button><button data-o='{"route":"element"}'>Element</button><button id="idle">Idle</button>
</div>
<script>
  const mode = new URLSearchParams(location.search).get("mode") || "heard";
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
  const info = document.getElementById("info");
  let ctx, t0, beeps = [];
  const PERIOD = 1, LEN = 0.06;
  function latency() {
    if (ctx.outputLatency > 0) return ctx.outputLatency;
    try { const ts = ctx.getOutputTimestamp(); const playing = ts.contextTime + (performance.now() - ts.performanceTime) / 1000; return Math.max(0, ctx.currentTime - playing); } catch { return 0; }
  }
  let quiet = false; // calQuiet(true): nothing scheduled, the context idle (as the app's between lines)
  window.calQuiet = (q) => { quiet = q; };
  // the context paused while idle (resumed by the next calStart, from a click)
  window.calSuspend = () => ctx.suspend().then(() => ctx.state);
  function schedule() {
    if (quiet) return;
    // keep 3 s of beeps queued
    const until = ctx.currentTime + 3;
    let k = beeps.length;
    while (t0 + k * PERIOD < until) {
      const at = t0 + k * PERIOD, len = k % 4 === 0 ? LEN * 3 : LEN;
      const o = ctx.createOscillator(); o.frequency.value = 1000;
      const g = ctx.createGain(); g.gain.value = 0.5;
      o.connect(g); g.connect(output());
      o.start(at); o.stop(at + len);
      beeps.push([at, len]); k++;
    }
  }
  function frame() {
    requestAnimationFrame(frame);
    if (!ctx) return;
    schedule();
    const t = ctx.currentTime - (mode === "heard" ? latency() : 0);
    const on = beeps.some(([at, len]) => t >= at && t < at + len);
    canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(on ? 1 : 0, on ? 1 : 0, on ? 1 : 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    info.textContent = `${mode} · out ${(latency() * 1000).toFixed(1)} ms · base ${((ctx.baseLatency || 0) * 1000).toFixed(1)} ms`;
  }
  // the beeps' way out: the context's own output, or a MediaStream played by an <audio> element (?route=element)
  let out = null, el = null;
  function output() {
    if (!out) return ctx.destination;
    return out;
  }
  /** opts (Safari stuck-output tests, stale.mjs): fresh (close the context, make a new one), sampleRate, hint
   *  (latencyHint), route ("direct" | "element"), cycle (suspend then resume the context first). */
  // a click starts the next measurement with window.calNext's options (Safari starts audio only from a gesture)
  document.getElementById("go").onclick = () => { window.calInfo = null; window.calStart(window.calNext || {}).then((i) => (window.calInfo = i)); };
  document.querySelectorAll("#touch [data-o]").forEach((b) => (b.onclick = () => window.calStart(JSON.parse(b.dataset.o)).then((i) => (info.dataset.last = JSON.stringify(i)))));
  // the context left running with nothing to play (the old player's habit)
  document.getElementById("idle").onclick = () => { ctx = ctx || new AudioContext(); ctx.resume(); quiet = true; };
  window.calStart = async (opts = {}) => {
    quiet = false;
    if (opts.fresh && ctx) { try { await ctx.close(); } catch {} ctx = null; }
    if (!ctx) {
      const o = {};
      if (opts.sampleRate) o.sampleRate = opts.sampleRate;
      if (opts.hint) o.latencyHint = opts.hint;
      ctx = new AudioContext(o);
      out = null;
    }
    if (opts.cycle) { await ctx.suspend(); await ctx.resume(); }
    if (opts.route === "element") {
      const d = ctx.createMediaStreamDestination();
      el = el || document.body.appendChild(document.createElement("audio"));
      el.srcObject = d.stream;
      el.play();
      out = d;
    } else if (opts.route === "direct") out = null;
    ctx.resume();
    t0 = Math.ceil(ctx.currentTime + 0.5);
    beeps = [];
    return { sampleRate: ctx.sampleRate, out: ctx.outputLatency, base: ctx.baseLatency };
  };
  /** The microphone on (as a chat's: echo cancellation, noise suppression, gain control) or off. */
  let mic = null;
  window.calMic = async (on) => {
    if (mic) { mic.getTracks().forEach((t) => t.stop()); mic = null; }
    if (!on) return "off";
    try {
      mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      return "on " + mic.getAudioTracks()[0].label;
    } catch (e) { return "mic failed: " + e.name; }
  };
  /** A continuous murmur (the context kept busy), as speech playing when the tab goes to the background. */
  let fill = null;
  window.calFill = (on) => {
    if (fill) { fill.stop(); fill = null; }
    if (!on) return;
    ctx = ctx || new AudioContext();
    ctx.resume();
    const b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.sin(i / ctx.sampleRate * 2 * Math.PI * 180) * 0.05 * (0.5 + 0.5 * Math.sin(i / ctx.sampleRate * 2 * Math.PI * 4));
    fill = ctx.createBufferSource(); fill.buffer = b; fill.loop = true; fill.connect(output()); fill.start();
  };
  requestAnimationFrame(frame);
</script>
</body>
</html>
